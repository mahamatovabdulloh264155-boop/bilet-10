<style>

<body class="text-slate-900 dark:text-slate-100 font-sans">
<div id="root" class="h-full"></div>
<script>
const {useState,useEffect,useMemo}=React;const html=htm.bind(React.createElement);
const P={plus:'M5 12h14M12 5v14',search:'m21 21-4.3-4.3M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16',x:'M18 6 6 18M6 6l12 12',right:'M5 12h14m-7-7 7 7-7 7',left:'M19 12H5m7 7-7-7 7-7',check:'M20 6 9 17l-5-5',trash:'M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z',board:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',table:'M3 3h18v18H3zM3 9h18M3 15h18M9 3v18',chart:'M3 3v18h18M7 16v-5M12 16V7M17 16v-3',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',moon:'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z',cal:'M3 4h18v18H3zM16 2v4M8 2v4M3 10h18',reset:'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5',layers:'m12 2 10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5',clock:'M12 6v6l4 2M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z',phone:'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z',send:'m22 2-7 20-4-9-9-4Zm0 0L11 13',shield:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',flame:'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3 0 1.4 1 2.5 2.5 2.5Z',cross:'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',zap:'M13 2 3 14h9l-1 8 10-12h-9l1-8z',wind:'M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2',drop:'M12 2.7s7 7.3 7 12a7 7 0 0 1-14 0c0-4.7 7-12 7-12z',bld:'M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4',mon:'M2 4h20v12H2zM8 20h8M12 16v4',alert:'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01',lock:'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4'};
const Ic=({n,c='w-4 h-4'})=>html`<svg viewBox="0 0 24 24" className=${c} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d=${P[n]}/></svg>`;
const DEP={
iiv:{n:'IIV',f:'Ichki ishlar vazirligi',i:'shield',pr:'high',c:'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300',k:'janjal,urush,kaltak,tahdid,ogirlik,ogri,talon,bosqin,jinoyat,zorlik,qotil,firibgar,avariya,politsiya,militsiya,giyohvand,tartibsizlik,shovqin,urib ketdi,mast haydovchi'},
fvv:{n:'FVV',f:'Favqulodda vaziyatlar vazirligi',i:'flame',pr:'high',c:'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-300',k:'yongin,olov,tutun,portlash,zilzila,toshqin,kochki,qutqaruv,qulad,kimyoviy,radiatsiya,yonib,yonmoqda,yonyapti,yonayot,suv toshqin'},
ssv:{n:'Tez yordam',f:'Sog’liqni saqlash vazirligi',i:'cross',pr:'high',c:'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300',k:'tez yordam,kasal,jarohat,qon ket,hushidan,nafas,yurak,zaharlan,shifokor,ogriq,isitma,tugruq,yaralan,qonash,tutqanoq'},
gaz:{n:'Hududgaz',f:'Hududiy gaz ta’minoti',i:'wind',pr:'high',c:'bg-orange-100 text-orange-700 dark:bg-orange-500/20 dark:text-orange-300',k:'gaz,plita,balon'},
elk:{n:'Elektr tarmoqlari',f:'Hududiy elektr tarmoqlari',i:'zap',pr:'mid',c:'bg-yellow-100 text-yellow-800 dark:bg-yellow-500/20 dark:text-yellow-300',k:'elektr,svet,tok,chiroq,yoruglik,transformator,simyogoch'},
suv:{n:'Suv ta’minoti',f:'Suv ta’minoti va kanalizatsiya xizmati',i:'drop',pr:'mid',c:'bg-cyan-100 text-cyan-700 dark:bg-cyan-500/20 dark:text-cyan-300',k:'suv,quvur,kanalizatsiya,vodoprovod,kran,oqayapti,oqmoqda,bosim'},
hok:{n:'Hokimlik',f:'Hokimlik obodonlashtirish bo’limi',i:'bld',pr:'low',c:'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300',k:'yol,chuqur,axlat,chiqindi,svetofor,yoritish,kocha,ariq,daraxt,trotuar,obodon,hokim,avtobus,maydoncha,hovli'},
it:{n:'Texnik yordam',f:'Texnik yordam xizmati',i:'mon',pr:'mid',c:'bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300',k:'ilova,parol,tizim,sayt,internet,hisobot,yukla,profil,tolov,dastur,server,login,akkaunt,xato,excel,rasm'},
gen:{n:'Umumiy bo’lim',f:'Mos mutaxassis topilmadi, umumiy bo’limga yo’naltiriladi',i:'layers',pr:'mid',c:'bg-slate-200 text-slate-700 dark:bg-slate-500/20 dark:text-slate-300',k:''}};
const dp=k=>DEP[k]||DEP.gen;
const ORD=['fvv','ssv','iiv','gaz','elk','suv','hok','it'];
const route=s=>{const t=(s||'').toLowerCase().replace(/[’'‘`ʻʼ´]/g,'');const w=t.split(/[^a-z0-9]+/).filter(Boolean);let b='gen',m=0;ORD.forEach(k=>{const n=DEP[k].k.split(',').reduce((a,e)=>a+((e.includes(' ')?t.includes(e):w.some(x=>x.startsWith(e)))?1:0),0);if(n>m){m=n;b=k}});return b};
const COLS=[{k:'new',n:'Yangi',bg:'bg-sky-200/40 dark:bg-sky-400/10',bd:'bg-sky-500',dot:'bg-sky-500'},{k:'doing',n:'Bajarilmoqda',bg:'bg-amber-200/40 dark:bg-amber-400/10',bd:'bg-amber-500',dot:'bg-amber-500'},{k:'done',n:'Tugagan',bg:'bg-emerald-200/40 dark:bg-emerald-400/10',bd:'bg-emerald-500',dot:'bg-emerald-500'}];
const SN={new:'Yangi',doing:'Bajarilmoqda',done:'Tugagan'};
const PR={high:['Yuqori','bg-rose-500','text-rose-700 bg-rose-100 dark:bg-rose-500/15 dark:text-rose-300'],mid:['O’rta','bg-amber-500','text-amber-700 bg-amber-100 dark:bg-amber-500/15 dark:text-amber-300'],low:['Past','bg-emerald-500','text-emerald-700 bg-emerald-100 dark:bg-emerald-500/15 dark:text-emerald-300']};
const ds=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('.'):'—';
const ini=n=>(n||'?').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sh=s=>s.length>42?s.slice(0,42)+'…':s;
const fmt=d=>[d.slice(0,2),d.slice(2,5),d.slice(5,7),d.slice(7,9)].filter(Boolean).join(' ');
const showPh=p=>p?'+998 '+fmt(p):'';
const mk=(name,surname,phone,title,dep,priority,status,due)=>({id:uid(),name,surname,phone,title,dep,priority,status,due});
const seed=()=>({tasks:[
mk('Dilshod','Rahimov','901234567','Ikki guruh o’rtasida janjal va kaltaklash boshlandi','iiv','high','new',ds(2)),
mk('Nodira','Saidova','934567890','Ko’p qavatli uyning 3-qavatida yong’in chiqdi','fvv','high','doing',ds(4)),
mk('Sardor','Ergashev','997654321','Uyda uch kundan beri elektr o’chgan, chiroqlar yonmayapti','elk','mid','new',ds(6)),
mk('Madina','Qodirova','971112233','Ilovada profil rasmi yuklanmayapti','it','low','done',ds(-1))],
log:[{t:Date.now(),x:'Namunaviy vazifalar yuklandi'}]});
const load=()=>{try{const s=JSON.parse(localStorage.getItem('vt_state3'));if(s&&s.tasks)return s}catch(e){}return seed()};
const glass='rounded-2xl border border-white/70 dark:border-white/10 bg-white/85 dark:bg-slate-900/75 shadow-sm shadow-sky-900/5';
const inp='w-full h-11 px-3.5 rounded-xl text-[15px] bg-white/90 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 outline-none focus:ring-4 focus:ring-sky-400/25 focus:border-sky-500 transition placeholder:text-slate-400';
const bt='inline-flex items-center gap-1 h-7 px-2.5 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700 bg-white/70 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-700 transition active:scale-95';
const prim='w-full h-12 rounded-xl text-[15px] font-semibold text-white bg-gradient-to-r from-sky-500 to-blue-600 shadow-lg shadow-sky-500/30 hover:brightness-110 transition active:scale-[.98] inline-flex items-center justify-center gap-2';
const Badge=({p})=>html`<span className=${'inline-flex shrink-0 items-center gap-1.5 px-2 py-0.5 rounded-md text-[11px] font-medium '+PR[p][2]}><span className=${'w-1.5 h-1.5 rounded-full '+PR[p][1]}></span>${PR[p][0]}</span>`;
const Av=({n,c='w-6 h-6 text-[10px]'})=>html`<span title=${n} className=${c+' shrink-0 rounded-full bg-gradient-to-br from-sky-400 to-indigo-500 text-white font-semibold grid place-items-center'}>${ini(n)}</span>`;
const DepChip=({k})=>html`<span className=${'inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold whitespace-nowrap '+dp(k).c}><${Ic} n=${dp(k).i} c="w-3 h-3"/>${dp(k).n}</span>`;
const Fld=({t,err,children})=>html`<label className="block"><span className="block text-[11px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-1.5">${t}</span>${children}${err?html`<span className="block text-xs text-rose-500 mt-1">${err}</span>`:null}</label>`;

function Form({init,onSave,onCancel,wizard}){
 const [f,setF]=useState(init);const [step,setStep]=useState(wizard?1:2);const [tr,setTr]=useState(false);
 const s=k=>e=>setF({...f,[k]:e.target.value});
 const ph=e=>setF({...f,phone:e.target.value.replace(/\D/g,'').replace(/^998/,'').slice(0,9)});
 const tt=e=>{const v=e.target.value,dep=f.manual?f.dep:route(v);setF({...f,title:v,dep,...(wizard&&!f.pm?{priority:dp(dep).pr}:{})})};
 const d=dp(f.dep);
 const panel=html`<div className="rounded-2xl border border-sky-200/70 dark:border-white/10 bg-sky-50/70 dark:bg-white/5 p-3 flex items-center gap-3"><span className=${'w-11 h-11 shrink-0 rounded-xl grid place-items-center '+d.c}><${Ic} n=${d.i} c="w-5 h-5"/></span><div className="min-w-0 flex-1"><div className="text-[10px] font-semibold uppercase tracking-wide text-slate-500 flex items-center gap-2">${f.manual?'Qo’lda tanlangan':'Avtomatik yo’naltirish'}${f.manual&&html`<button type="button" className="normal-case text-sky-600 hover:underline" onClick=${()=>setF({...f,manual:false,dep:route(f.title)})}>Avto</button>`}</div><div className="text-sm font-semibold truncate">${d.n}</div><div className="text-xs text-slate-500 line-clamp-2">${d.f}</div></div><select value=${f.dep} onChange=${e=>setF({...f,dep:e.target.value,manual:true})} className="h-8 w-24 shrink-0 rounded-lg text-xs bg-white/90 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none px-1.5">${Object.keys(DEP).map(k=>html`<option key=${k} value=${k}>${DEP[k].n}</option>`)}</select></div>`;
 const e1=f.phone.length!==9?'Telefon raqami 9 ta raqamdan iborat bo’lishi kerak':'';
 const er={name:wizard&&!f.name.trim()?'Ismni kiriting':'',surname:wizard&&!f.surname.trim()?'Familiyani kiriting':'',title:!f.title.trim()?'Muammoni yozing':''};
 const submit=e=>{e.preventDefault();setTr(true);
  if(step===1){if(!e1){setStep(2);setTr(false)}return}
  if(er.name||er.surname||er.title)return;
  onSave({...f,name:f.name.trim(),surname:f.surname.trim(),title:f.title.trim()})};
 const phoneBox=html`<div className="flex rounded-xl border border-slate-200 dark:border-slate-700 bg-white/90 dark:bg-slate-900/60 focus-within:ring-4 focus-within:ring-sky-400/25 focus-within:border-sky-500 transition"><span className="px-3.5 grid place-items-center text-[15px] text-slate-500 border-r border-slate-200 dark:border-slate-700">+998</span><input autoFocus=${step===1} inputMode="tel" className="flex-1 min-w-0 h-11 px-3 bg-transparent outline-none text-[15px] tabular-nums" value=${fmt(f.phone)} onChange=${ph} placeholder="90 123 45 67"/></div>`;
 if(step===1)return html`<form onSubmit=${submit} className="space-y-4">
  <div className="text-center mb-2"><div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-sky-400 to-blue-600 grid place-items-center text-white shadow-lg shadow-sky-500/30"><${Ic} n="send" c="w-9 h-9"/></div><h2 className="text-xl font-bold mt-4">Telefon raqami</h2><p className="text-sm text-slate-500 mt-1">Mijoz bilan bog’lanish uchun raqamni kiriting</p></div>
  <div className="h-11 px-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-900/40 flex items-center justify-between text-[15px]"><span>O’zbekiston</span><span className="text-slate-500">+998</span></div>
  <${Fld} t="Telefon raqami" err=${tr?e1:''}>${phoneBox}<//>
  <button type="submit" className=${prim}>Keyingisi<${Ic} n="right"/></button>
  <button type="button" onClick=${onCancel} className="w-full text-sm text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition">Bekor qilish</button></form>`;
 return html`<form onSubmit=${submit} className="space-y-4">
  ${wizard&&html`<div className="flex items-center justify-between"><button type="button" onClick=${()=>setStep(1)} className=${bt+' h-8'}><${Ic} n="left" c="w-3 h-3"/>Orqaga</button><span className="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 h-8 rounded-full bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300"><${Ic} n="phone" c="w-3 h-3"/>${showPh(f.phone)}</span></div>
  <div className="text-center"><h2 className="text-xl font-bold">Mijoz ma’lumotlari</h2><p className="text-sm text-slate-500 mt-1">Ism, familiya va muammoni yozing. Vazifa mutaxassisga avtomatik yo’naltiriladi</p></div>`}
  ${!wizard&&html`<${Fld} t="Telefon raqami">${phoneBox}<//>`}
  <div className="grid grid-cols-2 gap-3">
   <${Fld} t="Ism" err=${tr?er.name:''}><input autoFocus=${wizard} className=${inp} value=${f.name} onChange=${s('name')} placeholder="Ism"/><//>
   <${Fld} t="Familiya" err=${tr?er.surname:''}><input className=${inp} value=${f.surname} onChange=${s('surname')} placeholder="Familiya"/><//>
  </div>
  <${Fld} t="Muammo" err=${tr?er.title:''}><textarea rows="3" className=${inp+' h-auto py-2.5 resize-none'} value=${f.title} onChange=${tt} placeholder="Muammoni batafsil yozing..."></textarea><//>
  ${panel}
  <${Fld} t="Ustuvorlik"><div className="grid grid-cols-3 gap-2">${Object.keys(PR).map(k=>html`<button type="button" key=${k} onClick=${()=>setF({...f,priority:k,pm:true})} className=${'h-10 rounded-xl text-sm font-medium border transition '+(f.priority===k?'border-sky-500 bg-sky-500/10 text-sky-700 dark:text-sky-300 ring-2 ring-sky-400/30':'border-slate-200 dark:border-slate-700 text-slate-500 hover:bg-white/70 dark:hover:bg-slate-800')}>${PR[k][0]}</button>`)}</div><//>
  <div className=${'grid gap-3 '+(wizard?'grid-cols-1':'grid-cols-2')}>
   
   <${Fld} t="Muddat"><input type="date" className=${inp} value=${f.due} onChange=${s('due')}/><//>
   ${!wizard&&html`<${Fld} t="Holat"><select className=${inp} value=${f.status} onChange=${s('status')}>${COLS.map(c=>html`<option key=${c.k} value=${c.k}>${c.n}</option>`)}</select><//>`}
  </div>
  ${wizard?html`<button type="submit" className=${prim}><${Ic} n="send"/>Vazifani yaratish</button>`:html`<div className="flex gap-2 pt-1"><button type="button" onClick=${onCancel} className="h-11 px-4 rounded-xl text-sm font-medium border border-slate-200 dark:border-slate-700 hover:bg-white/70 dark:hover:bg-slate-800 transition">Bekor qilish</button><button type="submit" className=${prim+' flex-1 !h-11'}>Saqlash</button></div>`}
 </form>`}

function TaskCard({t,open,move,del}){
 const st=fn=>e=>{e.stopPropagation();fn()};const cl=(t.name+' '+t.surname).trim();
 return html`<div draggable="true" onDragStart=${e=>e.dataTransfer.setData('text',t.id)} onClick=${()=>open(t.id)} className=${glass+' p-3.5 cursor-grab active:cursor-grabbing hover:shadow-lg [@media(hover:hover)]:hover:-translate-y-0.5 transition up'}>
  <div className="flex items-start justify-between gap-2"><h4 className="text-sm font-semibold leading-snug line-clamp-3">${t.title}</h4><${Badge} p=${t.priority}/></div>
  ${!cl&&!t.phone&&html`<div className="mt-3 inline-flex items-center gap-1.5 text-xs text-slate-500"><${Ic} n="lock" c="w-3 h-3"/>Anonim xabar</div>`}${(cl||t.phone)&&html`<div className="flex items-center gap-2.5 mt-3 p-2 rounded-xl bg-sky-50/80 dark:bg-white/5"><${Av} n=${cl||'?'} c="w-8 h-8 text-xs"/><div className="min-w-0 text-xs"><div className="font-medium truncate">${cl||'Mijoz'}</div>${t.phone&&html`<div className="text-slate-500 flex items-center gap-1 tabular-nums"><${Ic} n="phone" c="w-3 h-3"/>${showPh(t.phone)}</div>`}</div></div>`}

     <div className=${glass+' p-5'}><h3 className="text-sm font-semibold mb-4">Bo’limlar yuklamasi</h3><div className="space-y-4">${Object.keys(DEP).filter(m=>tasks.some(t=>t.dep===m)).map(m=>{const a=tasks.filter(t=>t.dep===m);return html`<div key=${m}><div className="flex justify-between text-xs mb-1.5"><span className="flex items-center gap-2"><${DepChip} k=${m}/></span><span className="text-slate-500 tabular-nums">${a.length} ta</span></div><div className="h-2.5 rounded-full bg-slate-200/70 dark:bg-white/10 flex overflow-hidden">${[['new','bg-sky-500'],['doing','bg-amber-500'],['done','bg-emerald-500']].map(([k,c])=>html`<div key=${k} className=${c+' transition-all duration-500'} style=${{width:(total?a.filter(t=>t.status===k).length/total*100:0)+'%'}}></div>`)}</div></div>`})}</div>
      <div className="flex gap-4 mt-5 text-xs text-slate-500">${[['Yangi','bg-sky-500'],['Bajarilmoqda','bg-amber-500'],['Tugagan','bg-emerald-500']].map(([n,c])=>html`<span key=${n} className="flex items-center gap-1.5"><span className=${'w-2 h-2 rounded-full '+c}></span>${n}</span>`)}</div></div>
     <div className=${glass+' p-5'}><h3 className="text-sm font-semibold mb-4">Faoliyat jurnali</h3><ul className="space-y-3 max-h-80 overflow-y-auto">${log.map((l,i)=>html`<li key=${i} className="flex gap-3 text-sm"><span className="w-1.5 h-1.5 mt-2 rounded-full bg-sky-500 shrink-0"></span><div><div>${l.x}</div><div className="text-xs text-slate-400">${tm(l.t)}</div></div></li>`)}</ul></div></div>`}
   </div>
  </main>
  ${modal&&html`<div className="fixed inset-0 z-40 grid place-items-center p-4 bg-slate-900/40 backdrop-blur-sm fd" onClick=${()=>setModal(false)}><div className=${'w-full max-w-[420px] max-h-full overflow-y-auto rounded-3xl p-7 shadow-2xl bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-white/70 dark:border-white/10 up'} onClick=${e=>e.stopPropagation()}><${Form} wizard=${true} init=${{title:'',name:'',surname:'',phone:'',dep:'gen',priority:'mid',due:ds(3)}} onCancel=${()=>setModal(false)} onSave=${o=>{add(o);setModal(false)}}/></div></div>`}
  ${dt&&html`<div className="fixed inset-0 z-40 bg-slate-900/30 backdrop-blur-[2px] fd" onClick=${()=>setDrawer(null)}><aside key=${dt.id} onClick=${e=>e.stopPropagation()} className="sl absolute right-0 top-0 h-full w-full max-w-md bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border-l border-white/70 dark:border-white/10 p-6 overflow-y-auto shadow-2xl"><div className="flex items-center justify-between mb-5"><h2 className="text-lg font-bold">Vazifa tafsilotlari</h2><button className=${bt} onClick=${()=>setDrawer(null)}><${Ic} n="x" c="w-3.5 h-3.5"/></button></div><${Form} init=${dt} onCancel=${()=>setDrawer(null)} onSave=${save}/><button onClick=${()=>del(dt.id)} className="mt-6 text-xs font-medium text-rose-600 inline-flex items-center gap-1.5 hover:underline"><${Ic} n="trash" c="w-3.5 h-3.5"/>Vazifani o’chirish</button></aside></div>`}
  ${sent&&html`<${Sent} t=${sent} onClose=${()=>setSent(null)}/>`}
  ${toast&&html`<div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 up max-w-[92vw]"><div className="flex items-center gap-2 px-4 py-2.5 rounded-2xl text-sm shadow-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900"><${Ic} n="check" c="w-4 h-4 shrink-0 text-emerald-400"/>${toast}</div></div>`}
 </div></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
